apiVersion: mutations.gatekeeper.sh/v1beta1
kind: Assign
metadata:
  name: assign-scale-out-compute-class
spec:
  applyTo:
  - groups: [""]
    kinds: ["Pod"]
    versions: ["v1"]
  match:
    scope: Namespaced
    namespaces: ["default"]
    labelSelector:
      matchLabels:
        tier: batch
  location: 'spec.nodeSelector."cloud.google.com/compute-class"'
  parameters:
    assign:
      value: "Scale-Out"